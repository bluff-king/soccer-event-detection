# v2 data: official SoccerNet Labels-v2 (466 games with transcripts: 283 / 90 / 93) instead of the GitHub mirror
# (434 games). Checkpoint selection on EVENT-level F1 over 45 whole validation games (thresholds tuned on them,
# NMS, +-30 s matching). Selecting on segment-level F1 of a shuffled subset picked a late, over-confident checkpoint
# (v2_baseline: event F1 0.389, 692 Goal false positives, most of them on post-goal chatter).
_base_: ../base_local.yaml
output_dir: outputs/local/v2_baseline
run_name: v2_baseline
data:
  label_source: official
  processed_dir: data/processed_v2
train:
  select_games: 45
  select_metric: event_f1
logging:
  group: local-v2
